# ============================================================
# Environment / execution configuration
# Values here can be overridden at runtime with -D system properties,
# e.g. mvn test -Dbrowser=firefox -Dbase.url=https://www.amazon.in
# ============================================================

# Target site under test
base.url=https://www.amazon.in

# Browser: chrome | firefox | edge
browser=chrome

# Run browser headless (true/false)
headless=false

# Timeouts (seconds)
implicit.wait=0
explicit.wait=30
page.load.timeout=45

# Number of products/categories to shop for in the E2E scenario
products.to.select=5

# Folders (relative to project root)
proof.dir=proof
reports.dir=reports
test.data.file=test-data/categories.csv

# Retry attempts when a product/category yields no available product
category.selection.retry=3
